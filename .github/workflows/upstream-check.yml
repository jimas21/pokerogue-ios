name: Upstream check

# Once a day: if PokeRogue has published a release that has not been built yet, start the TestFlight build for it.
# New events, fixes and balance changes reach the phone through TestFlight's automatic updates.
on:
  schedule:
    - cron: "23 13 * * *"   # daily, 13:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to start the TestFlight workflow

jobs:
  check:
    if: ${{ vars.TEAM_ID != '' && vars.BUNDLE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compare latest PokeRogue release with what was built
        run: |
          set -euo pipefail
          tag="$(gh api repos/pagefaultgames/pokerogue/releases/latest --jq .tag_name)"
          echo "Latest PokeRogue release: $tag"
          built="$(gh run list -R "$GITHUB_REPOSITORY" --workflow testflight.yml --limit 100 \
            --json displayTitle,status,conclusion \
            --jq '.[] | select(.conclusion == "success" or .status != "completed") | .displayTitle')"
          if grep -qxF "PokeRogue $tag" <<<"$built"; then
            echo "Already built (or building). Nothing to do."
            echo "PokeRogue $tag is already on TestFlight (or building)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run testflight.yml -R "$GITHUB_REPOSITORY" -f upstream_ref="$tag"
          echo "Started the TestFlight build for PokeRogue $tag." | tee -a "$GITHUB_STEP_SUMMARY"
