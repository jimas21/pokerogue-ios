name: TestFlight
run-name: PokeRogue ${{ inputs.upstream_ref }}

# Builds PokeRogue (official source, offline app mode) into the iOS app on a cloud Mac and uploads it to
# TestFlight. Started by the daily "Upstream check" when PokeRogue publishes a new release, or by hand from the
# Actions tab. Pull requests (including forks) never run this, because it holds signing secrets.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: PokeRogue release tag to build (e.g. v1.12.2.6)
        required: true
        type: string

permissions:
  contents: read

# One build at a time; never cancel a run that may be mid-upload.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Build game, archive, upload
    if: ${{ vars.TEAM_ID != '' && vars.BUNDLE_ID != '' }}
    runs-on: macos-26   # Xcode 26.x, iOS 26 SDK (Apple requires it for uploads). Free on public repos.
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preflight (settings present and well-formed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash ci/preflight.sh

      - name: Get PokeRogue source
        run: |
          git clone --depth 1 --branch "$UPSTREAM_REF" --recurse-submodules --shallow-submodules \
            https://github.com/pagefaultgames/pokerogue.git upstream

      - name: Set up Node (version PokeRogue asks for)
        uses: actions/setup-node@v5
        with:
          node-version-file: upstream/.nvmrc

      - name: Build the game (offline app mode)
        run: bash ci/build_game.sh

      - name: Make app icon
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" ci/make_icon.py Game/logo512.png App/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || { brew update && brew install xcodegen; }

      - name: Write API key to a temp file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash ci/write_key.sh

      - name: Generate project and archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ci/archive.sh

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ci/export_upload.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "### Uploaded to TestFlight"
            echo ""
            echo "- PokeRogue: \`${UPSTREAM_REF}\`"
            echo "- Build number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- App commit: \`${GITHUB_SHA::7}\`"
            echo ""
            echo '```'
            cat Game/BUILD-INFO.txt
            echo '```'
            echo ""
            echo "The build appears in TestFlight after Apple finishes processing it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key file
        if: always()
        run: bash ci/cleanup.sh
