# XcodeGen project definition. CI runs `xcodegen generate`; the .xcodeproj is never committed.
# PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM, MARKETING_VERSION and CURRENT_PROJECT_VERSION are set on the
# xcodebuild command line by ci/archive.sh (from repo variables, the upstream PokeRogue version, and the run
# number), so nothing personal lives here.
#
# Game/ is the built PokeRogue web game (ci/build_game.sh). It is copied into the app as a folder, so its
# directory layout (images/, audio/, locales/...) is kept exactly as the game expects.
name: PokeRogue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PokeRogue:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Game
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PokeRogue
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE.pokerogue   # placeholder; CI overrides from vars.BUNDLE_ID
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"                         # CI overrides with the upstream PokeRogue version
        CURRENT_PROJECT_VERSION: "1"                       # CI overrides with the run number
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"                      # iPhone and iPad
        SWIFT_VERSION: "5.0"
